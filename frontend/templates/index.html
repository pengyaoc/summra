<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summra - Classic Book Summaries</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <a href="#/" class="header-link" id="header-home-link">
                    <img src="{{ url_for('static', filename='images/icon.png') }}" alt="Summra Icon" class="logo-icon">
                    <h1 class="logo">Summra</h1>
                </a>
                <div class="header-nav-buttons">
                    <a href="#/categories" class="header-nav-btn" id="categories-nav-btn">Categories</a>
                    <a href="#/all-books" class="header-nav-btn" id="all-books-nav-btn">All Books</a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Category Carousels Section -->
            <section class="categories-section" id="categories-section">
                <div class="categories-container" id="categories-container">
                    <!-- Categories will be dynamically loaded here -->
                </div>
            </section>

            <!-- Book Detail Section -->
            <section class="summary-section hidden" id="summary-section">
                <div class="back-button-container">
                    <button class="back-button" id="back-button">← Back to Books</button>
                </div>

                <div class="book-detail-header">
                    <img id="book-info-cover" class="book-detail-cover hidden" alt="Book cover">
                    <div class="book-detail-info">
                        <h2 id="book-title"></h2>
                        <p class="book-author" id="book-author"></p>
                    </div>
                </div>

                <!-- Main Content Area -->
                <div class="book-content" id="book-content">
                    <!-- Concise Summary -->
                    <div class="concise-summary-section" id="concise-summary-section">
                        <div class="section-header">
                            <h3>Quick Summary</h3>
                            <button class="tts-button-inline" id="concise-tts-button">🔊 Listen</button>
                        </div>
                        <div class="concise-preview-container" id="concise-preview-container">
                            <div class="summary-text concise-preview-text" id="concise-summary-text"></div>
                            <div class="concise-preview-fade" id="concise-preview-fade"></div>
                        </div>
                        <button class="expand-link centered hidden" id="concise-expand-button">Read Quick Summary →</button>
                    </div>

                    <!-- Medium Summary Preview -->
                    <div class="medium-preview-section" id="medium-preview-section">
                        <div class="section-header">
                            <h3>Full Summary</h3>
                        </div>
                        <div class="medium-preview-container">
                            <div class="summary-text medium-preview-text" id="medium-preview-text"></div>
                            <div class="preview-fade"></div>
                        </div>
                        <button class="expand-link centered" id="medium-expand-button">Read Full Summary →</button>
                    </div>

                    <!-- Chapters List -->
                    <div class="chapters-section" id="chapters-section">
                        <h3>Chapters</h3>
                        <div class="chapters-list" id="chapters-list"></div>
                    </div>
                </div>
            </section>

            <!-- Medium Summary Detail Section -->
            <section class="medium-detail-section hidden" id="medium-detail-section">
                <div class="back-button-container">
                    <button class="back-button" id="medium-back-button">← Back to Book</button>
                </div>

                <div class="medium-detail-header">
                    <h2 id="medium-detail-title"></h2>
                    <p class="medium-detail-subtitle" id="medium-detail-subtitle"></p>
                </div>

                <div class="medium-detail-content">
                    <div class="section-header">
                        <h3>Full Summary</h3>
                        <button class="tts-button-inline" id="medium-detail-tts-button">🔊 Listen</button>
                    </div>
                    <div class="summary-text" id="medium-detail-text"></div>
                </div>
            </section>

            <!-- Chapter Detail Section -->
            <section class="chapter-detail-section hidden" id="chapter-detail-section">
                <div class="back-button-container">
                    <button class="back-button" id="chapter-back-button">← Back to Book</button>
                </div>

                <div class="chapter-detail-header">
                    <h2 id="chapter-detail-title"></h2>
                    <p class="chapter-detail-subtitle" id="chapter-detail-subtitle"></p>
                </div>

                <div class="chapter-detail-content" id="chapter-detail-content">
                    <!-- Summary (Collapsed by default) -->
                    <div class="chapter-summary-box collapsed" id="chapter-summary-box">
                        <div class="chapter-summary-header" id="chapter-summary-header">
                            <h4>📝 Summary</h4>
                            <div class="chapter-summary-actions">
                                <button class="tts-button-inline" id="chapter-summary-tts-button">🔊 Listen</button>
                                <button class="toggle-summary-btn" id="toggle-summary-btn">▼</button>
                            </div>
                        </div>
                        <div class="chapter-summary-content hidden" id="chapter-summary-content">
                            <div class="summary-text" id="chapter-summary-text"></div>
                        </div>
                    </div>

                    <!-- Full Text -->
                    <div class="chapter-fulltext-section" id="chapter-fulltext-section">
                        <div class="section-header">
                            <h4>📖 Full Text</h4>
                            <button class="tts-button-inline" id="chapter-fulltext-tts-button">🔊 Listen</button>
                        </div>
                        <div class="chapter-fulltext" id="chapter-fulltext"></div>
                    </div>
                </div>
            </section>

            <!-- Category Detail Section -->
            <section class="category-detail-section hidden" id="category-detail-section">
                <div class="back-button-container">
                    <button class="back-button" id="category-back-button">← Back to Home</button>
                </div>

                <div class="category-detail-header">
                    <h2 id="category-detail-title"></h2>
                    <p class="category-detail-subtitle" id="category-detail-subtitle"></p>
                </div>

                <div class="books-grid" id="category-books-grid"></div>
            </section>

            <!-- All Categories Section -->
            <section class="all-categories-section hidden" id="all-categories-section">
                <div class="back-button-container">
                    <button class="back-button" id="all-categories-back-button">← Back to Home</button>
                </div>

                <h2 class="section-title">All Categories</h2>
                <div class="categories-container" id="all-categories-container"></div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Summra - Exploring public domain classics with AI assistance</p>
            <p class="small">Summaries generated using Google Gemini AI | TTS powered by VITS</p>
        </footer>
    </div>

    <!-- Persistent Audio Player (Fixed at Bottom) -->
    <div class="persistent-audio-player hidden" id="persistent-player">
        <div class="player-content">
            <div class="player-info">
                <div class="now-playing-icon">🎵</div>
                <div class="player-text">
                    <div class="player-title" id="player-title">No audio playing</div>
                    <div class="player-subtitle" id="player-subtitle"></div>
                </div>
            </div>
            <div class="player-controls">
                <audio id="persistent-audio-element"></audio>
                <button class="player-btn" id="player-stop" title="Stop and clear">⏹</button>
                <button class="player-btn" id="player-play-pause" title="Play/Pause">▶</button>
                <div class="player-progress">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="player-time">
                        <span id="current-time">0:00</span> / <span id="total-time">0:00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
