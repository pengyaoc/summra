<!DOCTYPE html>
<html lang="en" class="kindle {% block html_class %}{% endblock %}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>{% block title %}Plainly{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/kindle.css') }}{{ asset_v('css/kindle.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
{% block body %}{% endblock %}
</body>
</html>
