{# The reader shell. `reader_hidden` (set before including) hides it until the app opens a book. #}
            <section class="continuous-reader-section {% if reader_hidden %}hidden{% endif %}" id="continuous-reader-section" aria-label="Book reader">
                <header class="continuous-reader-chrome" id="continuous-reader-chrome">
                    <div class="reader-toolbar-left">
                        <button type="button" id="reader-back-button" class="reader-back-btn" aria-label="Back to book">←</button>
                        <div class="reader-title-wrap">
                            <span id="reader-chapter-title" class="reader-chapter-title"></span>
                            <span id="reader-book-title" class="reader-book-title"></span>
                        </div>
                    </div>
                    <div class="reader-toolbar-right">
                        <button type="button" id="reader-toc-button" class="reader-toolbar-btn reader-icon-btn" aria-expanded="false" title="Contents" aria-label="Contents">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                        </button>
                        <button type="button" id="reader-settings-button" class="reader-toolbar-btn reader-icon-btn" title="Reading settings" aria-label="Reading settings">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 16 4.5-9 4.5 9"/><path d="M4.5 13h6"/><path d="M16 16v-3.5a2.5 2.5 0 0 1 5 0V16"/><path d="M21 14h-5"/></svg>
                        </button>
                    </div>
                </header>
                <aside class="reader-panel hidden" id="reader-toc-panel" role="dialog" aria-modal="true" aria-label="Table of contents">
                    <div class="reader-panel-header">
                        <h2>Contents</h2>
                        <button type="button" class="reader-panel-close" data-reader-close="reader-toc-panel" aria-label="Close contents">✕</button>
                    </div>
                    <div id="reader-toc-list"></div>
                </aside>
                <div class="reader-status hidden" id="reader-status" role="status"></div>
                <div class="continuous-reader-content" id="continuous-reader-content" tabindex="-1"></div>
                <div class="continuous-reader-footer" role="status" aria-label="Reading progress">
                    <div class="reader-progress-track" aria-hidden="true"><span id="reader-progress-fill" style="width: 0%"></span></div>
                    <span id="reader-save-status" class="reader-save-status" aria-live="polite"></span>
                    <span id="continuous-reader-progress">0%</span>
                </div>
            </section>
