[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "summra"
version = "0.1.0"
description = "Summra: a shared reading platform with two apps, Plainly (classics in Plain English) and Distill (private book summaries)"
requires-python = ">=3.11"
# Runtime dependencies stay in plainly/requirements.txt / deploy/plainly/requirements-prod.txt
# (installed separately) — this project file exists to make `plainly` and
# `plainly.scripts` importable as real packages via `pip install -e .`, replacing the
# sys.path hacks and try/except ImportError shims that used to be needed for
# every script and test to find `config`, `models`, and sibling scripts.
dependencies = []

[tool.setuptools.packages.find]
include = ["plainly*", "shared*", "distill*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["plainly/scripts/archive", "venv", "data"]

[tool.ruff.lint]
# Start permissive — this repo has no lint history. Tighten incrementally
# rather than gating the packaging/CI rollout on a full lint pass.
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
# Only collect tests from the tests/ directory
# (prevents picking up CLI/debug scripts under scripts/ that are named test_*.py)
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselected by default)",
    "content: validates the local curated content database (opt in with -m content)",
]
# External content audits and slow tests are opt-in.
# Run with -m content or -m slow to select either group explicitly.
addopts = '-m "not slow and not content"'
