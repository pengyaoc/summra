{# A book's cover, or a placeholder card built from its title when it has none. #}
{% macro cover(book) -%}
{% if book.cover_image -%}
<img class="distill-cover" src="{{ base_path }}/books/{{ book.slug }}/images/{{ book.cover_image|urlencode }}" alt="" loading="lazy">
{%- else -%}
<div class="distill-cover book-cover-placeholder" aria-hidden="true"><span>{{ book.title }}</span></div>
{%- endif %}
{%- endmacro %}
