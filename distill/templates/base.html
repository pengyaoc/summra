{% macro brand_mark() -%}
<svg class="distill-mark" data-logo-mark="drop" viewBox="0 0 40 40" fill="none" aria-hidden="true">
    <path d="M20 3C17 10 8 18 8 25a12 12 0 0 0 24 0C32 18 23 10 20 3Z" fill="currentColor"/>
    <path d="M14 23h12M16 28h8" stroke="var(--surface)" stroke-width="2.3" stroke-linecap="round"/>
</svg>
{%- endmacro %}
<!DOCTYPE html>
<html lang="{% block lang %}en{% endblock %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Distill{% endblock %}</title>
    <script>window.APP_BASE_PATH = {{ (base_path | default('')) | tojson }};</script>
    {% include 'shared/reader/_config_script.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='shared/css/base.css') }}{{ asset_v('shared/css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='shared/css/reader.css') }}{{ asset_v('shared/css/reader.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/distill.css') }}{{ asset_v('css/distill.css') }}">
</head>
<body{% block body_attrs %}{% endblock %}>
{% block header %}
    <header class="distill-header">
        <a class="distill-wordmark" href="{{ base_path }}/" aria-label="Distill home">
            <span id="distill-brand-mark">{{ brand_mark() }}</span><span>Distill<span class="distill-brand-dot">.</span></span>
        </a>
        <span class="distill-header-caption">A little reading. A lot to keep.</span>
    </header>
{% endblock %}
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
