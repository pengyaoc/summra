# Nginx configuration for Summra (standalone deployment)
# Place in /etc/nginx/sites-available/summra and symlink to sites-enabled

upstream summra_app {
    server 127.0.0.1:5000 fail_timeout=30s max_fails=3;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tts_limit:10m rate=2r/m;

# HTTP server (redirect to HTTPS in production)
server {
    listen 80;
    server_name summra.yourdomain.com;  # Change this to your domain

    # For Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS (uncomment after SSL setup)
    # return 301 https://$server_name$request_uri;

    # Temporary: Allow HTTP during setup
    client_max_body_size 10M;

    # Include common config
    include /etc/nginx/snippets/summra-common.conf;
}

