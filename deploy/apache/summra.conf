# Summra Apache reverse-proxy + static fragment for cohosted deployments.
#
# Installed by deploy/install.sh to /etc/apache2/service-locations/summra.conf,
# included from the host-owned vhost via:
#   Define SUMMRA_PREFIX /summrabook
#   IncludeOptional /etc/apache2/service-locations/*.conf
# (See the vault note 01-projects/personal-brand/wordpress-vm-pages-setup.md
# for the host vhost's full shared context — TLS, ServerName,
# ProxyPreserveHost. That file changes rarely and is not owned by this repo.)
#
# ProxyPreserveHost On must be set at the vhost level (not here) — Summra's
# site_origin() needs the real Host header for canonical/OG/sitemap URLs.
#
# Static assets are served directly by Apache, not proxied to gunicorn.
#
# IMPORTANT: both the exclusion and the main proxy directive below use the
# FLAT (non-<Location>-wrapped) ProxyPass/ProxyPassReverse form, and this is
# load-bearing, not stylistic. Verified empirically on Apache 2.4.68
# (Debian trixie): a flat "ProxyPass /x/static/ !" does NOT reliably take
# precedence over a broader "<Location /x/> ProxyPass url</Location>" block
# covering the same prefix, even though both the flat-exclusion-before-
# Location-proxy and the fully-<Location>-nested-exclusion forms are
# individually documented Apache patterns. Apache's longest-prefix-first
# sorting for ProxyPass appears to apply only within same-registration-type
# entries — mixing a flat exclusion with a <Location>-scoped app proxy left
# the app's Location "winning" for every sub-path regardless of the
# exclusion. Making BOTH directives flat puts them in the same sorted
# table and the exclusion applies correctly. X-Forwarded-Prefix/-Proto
# still need a <Location> block (RequestHeader's URL-scoping is unrelated
# to ProxyPass's handler-selection precedence, so this part is unaffected
# by the bug above). Re-verify this ordering if upgrading Apache.
#
# Flask's own static route stays registered as a fallback
# (backend/app_base.py's static_folder), so a standalone deploy without
# this fragment still works, just slower.

ProxyPass ${SUMMRA_PREFIX}/static/ !
Alias ${SUMMRA_PREFIX}/static/ /opt/summra/frontend/static/
<Directory /opt/summra/frontend/static>
    Require all granted
    Options -Indexes
    ExpiresActive On
    ExpiresDefault "access plus 30 days"
    Header set Cache-Control "public, immutable"
</Directory>

RedirectMatch ^${SUMMRA_PREFIX}$ ${SUMMRA_PREFIX}/
ProxyPass        ${SUMMRA_PREFIX}/ http://127.0.0.1:5001/
ProxyPassReverse ${SUMMRA_PREFIX}/ http://127.0.0.1:5001/
<Location ${SUMMRA_PREFIX}/>
    RequestHeader set X-Forwarded-Prefix ${SUMMRA_PREFIX}
    RequestHeader set X-Forwarded-Proto "https"
</Location>
