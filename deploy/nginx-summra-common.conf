# Common Nginx configuration for Summra
# Place in /etc/nginx/snippets/summra-common.conf

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

# Serve static files directly (saves Flask memory/CPU)
location /static/ {
    alias /opt/summra/frontend/static/;
    expires 30d;
    add_header Cache-Control "public, immutable";

    # Enable byte-range requests for audio
    add_header Accept-Ranges bytes;
}

# Serve cover images with long cache
location /covers/ {
    alias /opt/summra/frontend/static/covers/;
    expires 90d;
    add_header Cache-Control "public, immutable";
}

# Serve audio files with long cache and range support
location /static/audio/ {
    alias /opt/summra/frontend/static/audio/;
    expires 90d;
    add_header Cache-Control "public, immutable";
    add_header Accept-Ranges bytes;
}

# API endpoints with rate limiting
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass http://summra_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_buffering off;

    # Timeouts for normal API requests
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# TTS endpoint with stricter rate limiting and longer timeout
location /api/tts/ {
    limit_req zone=tts_limit burst=1 nodelay;

    proxy_pass http://summra_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_redirect off;
    proxy_buffering off;

    # Longer timeouts for TTS generation (up to 5 minutes)
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# Health check endpoint (no rate limit)
location /health {
    proxy_pass http://summra_app;
    access_log off;
}

# Main application
location / {
    proxy_pass http://summra_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_redirect off;

    # Standard timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
