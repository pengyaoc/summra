# Distill Apache fragment: /etc/apache2/service-locations/distill.conf,
# included from the host vhost next to summra.conf (which documents the
# shared OIDC setup and why the ProxyPass directives are flat).
#
# Books, reading state and application code under /distill/ are owner-only.
# Content-free launch/branding and Kindle pairing bootstrap are public.
# - Normal visitors go to Google. Kindle e-readers reach application-level
#   authentication, which accepts only approved, browser-bound device sessions.
# - The app enforces the allow-list itself (DISTILL_ALLOWED_EMAILS) and
#   answers 403 to any other signed-in account.
# - Static files are proxied to gunicorn, not served by an Apache Alias:
#   they would otherwise skip sign-in, and distill_reader.js imports its
#   modules without cache-busting, so they must never be `public, immutable`.

RedirectMatch ^/distill$ /distill/
ProxyPass        /distill/ http://127.0.0.1:5002/
ProxyPassReverse /distill/ http://127.0.0.1:5002/

<Location /distill/>
    AuthType openid-connect
    # E-reader Kindle UAs may reach the app's browser-bound device auth.
    # False expressions retain the default Google sign-in action (auth).
    OIDCUnAuthAction pass "%{HTTP_USER_AGENT} =~ /\bKindle\b/ && %{HTTP_USER_AGENT} !~ /Silk|Kindle Fire|\bKF[A-Z]{2,5}\b|Android [0-9]/"
    Require valid-user
    # Scrub any client-supplied copy before setting Apache's own value.
    RequestHeader unset X-Remote-Email
    RequestHeader set X-Remote-Email %{OIDC_CLAIM_email}e env=OIDC_CLAIM_email
    RequestHeader set X-Forwarded-Prefix /distill
    RequestHeader set X-Forwarded-Proto "https"
</Location>

# Installation services fetch branding without the browser's OIDC cookie.
# The launch screen contains only sign-in controls, with inline style/script.
# Keep this exception narrow: no book content, worker, JS, CSS or user data.
<LocationMatch "^/distill/(launch|manifest\.webmanifest|favicon\.ico|app-icons/(favicon\.(svg|ico)|icon-(32|180|192|512)\.png))$">
    AuthType None
    Require all granted
    RequestHeader unset X-Remote-Email
</LocationMatch>

# Bootstrap contains no private content and works without modern JavaScript.
# The app permits this entry point only on Kindle e-reader user agents.
<LocationMatch "^/distill/pair(/qr\.png)?$">
    AuthType None
    Require all granted
    RequestHeader unset X-Remote-Email
</LocationMatch>

# Approval and revocation always require a real Google session, even on a
# Kindle UA. A previously paired reader cannot approve another device.
<LocationMatch "^/distill/pair/(approve|devices)$">
    AuthType openid-connect
    OIDCUnAuthAction auth
    Require valid-user
    RequestHeader unset X-Remote-Email
    RequestHeader set X-Remote-Email %{OIDC_CLAIM_email}e env=OIDC_CLAIM_email
</LocationMatch>
