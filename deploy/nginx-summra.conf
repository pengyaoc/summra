# Nginx configuration for Summra (to run alongside blog)
# Place in /etc/nginx/sites-available/summra and symlink to sites-enabled

upstream summra_app {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name summra.yourdomain.com;  # Change this

    # Redirect to HTTPS (if using SSL)
    # return 301 https://$server_name$request_uri;

    client_max_body_size 10M;

    # Serve static files directly (saves memory)
    location /static/ {
        alias /var/www/summra/frontend/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve cover images
    location /covers/ {
        alias /var/www/summra/frontend/static/covers/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve audio files with long cache
    location /static/audio/ {
        alias /var/www/summra/frontend/static/audio/;
        expires 90d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to Flask
    location / {
        proxy_pass http://summra_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# If using SSL (Certbot will add listen/ssl directives automatically):
