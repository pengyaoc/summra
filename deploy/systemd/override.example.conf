# Host-specific memory ceiling for the summra.service unit.
#
# MemoryMax is genuinely per-host (a dedicated e2-micro can afford more
# than a box cohosting several services) and can't be read from
# service.env, so it lives in a systemd drop-in instead of the unit file.
#
# Install to: ~/.config/systemd/user/summra.service.d/override.conf
# then: systemctl --user daemon-reload && systemctl --user restart summra
#
# Guidance:
#   - Dedicated VM (this is the only service):        400M
#   - Cohosted (alongside WordPress/OpenReader/etc.):  200M
# Measured actual footprint (gthread, 1 worker/4 threads, static served by
# the front-end proxy): ~58MB PSS. 200M leaves real headroom without
# starving neighbours on a ~964MB box.

[Service]
MemoryMax=200M
