[pytest]
# Pytest configuration

# Only collect tests from the tests/ directory
# (prevents picking up CLI/debug scripts under scripts/ that are named test_*.py)
testpaths = tests

# Register custom markers
markers =
    slow: marks tests as slow (deselected by default)

# Skip slow tests by default (run with: pytest -m slow to run only slow tests)
# Or run with: pytest -m "not slow" to explicitly skip slow tests
# Or run with: pytest --run-slow to run all tests including slow ones
addopts = -m "not slow"
