[pytest]
# Pytest configuration

# Only collect tests from the tests/ directory
# (prevents picking up CLI/debug scripts under scripts/ that are named test_*.py)
testpaths = tests

# Register custom markers
markers =
    slow: marks tests as slow (deselected by default)
    content: validates the local curated content database (opt in with -m content)

# External content audits and slow tests are opt-in.
# Run with -m content or -m slow to select either group explicitly.
addopts = -m "not slow and not content"
